<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TravelBloom</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* NAVBAR */
        nav {
            background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 30px;
            color: white;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
        }

        .logo span {
            margin-left: 10px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        .search-bar {
            display: flex;
            background: white;
            border-radius: 25px;
            padding: 5px;
        }

        .search-bar input {
            border: none;
            outline: none;
            padding: 8px 12px;
            width: 220px;
            border-radius: 20px;
        }

        .search-bar button {
            border: none;
            padding: 8px 14px;
            margin-left: 5px;
            border-radius: 20px;
            cursor: pointer;
            color: white;
        }

        .search-btn {
            background-color: #00796b;
        }

        .clear-btn {
            background-color: #009688;
        }

        /* HERO / HOME */
        .hero {
            height: 100vh;
            background-image: url("https://images.unsplash.com/photo-1505761671935-60b3a7427bad");
            background-size: cover;
            background-position: center;
            position: relative;
            color: white;
            padding-top: 80px;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
        }

        .hero-content {
            position: relative;
            max-width: 600px;
            margin-left: 80px;
            margin-top: 120px;
        }

        .hero-content h1 {
            font-size: 48px;
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .hero-content p {
            font-size: 16px;
            margin-bottom: 25px;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 5px;
        }

        .hero-content button {
            background-color: #009688;
            border: none;
            padding: 12px 25px;
            color: white;
            font-size: 14px;
            border-radius: 25px;
            cursor: pointer;
        }

        /* SOCIAL ICONS */
        .social {
            position: absolute;
            left: 20px;
            bottom: 40px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            font-size: 20px;
        }

        .social a {
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">✈ <span>TravelBloom</span></div>

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">About Us</a>
            <a href="#">Contact Us</a>
        </div>

        <div class="search-bar">
            <input type="text" placeholder="Enter a destination or keyword">
            <button class="search-btn">Search</button>
            <button class="clear-btn">Clear</button>
        </div>
    </nav>

    <section class="hero">
        <div class="overlay"></div>

        <div class="hero-content">
            <h1>EXPLORE<br>DREAM<br>DESTINATION</h1>

            <p>
                It encourages exploration of unfamiliar territories,
                embracing diverse cultures and landscapes, while pursuing
                the desired destination that captivates the heart and
                ignites a sense of wonder.
            </p>

            <button>BOOK NOW</button>
        </div>

        <div class="social">
            <a href="#">🐦</a>
            <a href="#">📘</a>
            <a href="#">📸</a>
            <a href="#">▶</a>
        </div>
    </section>

</body>
</html>
